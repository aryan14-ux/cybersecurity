version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: xss-lab-db
    environment:
      POSTGRES_USER: xsslab
      POSTGRES_PASSWORD: xsslab_dev_password
      POSTGRES_DB: xsslab
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
